                renderField('Instructions — What the agent does, step by step', 'instructions', "Describe what it does, how it responds, what it never says. This is your CRAFT prompt made permanent.", true, 'Context + Role + Action + Format + Target'),
                React.createElement('div', { style: { marginBottom: 4 } },
                  React.createElement('label', { style: { display: 'block', fontWeight: 700, fontSize: 14, color: COLORS.hof, marginBottom: 6, fontFamily: FONT } }, 'Escalation Rules (define at least 3)'),
                  React.createElement('p', { style: { margin: '0 0 10px', fontSize: 12, color: COLORS.foggy, fontFamily: FONT } }, 'When should it hand off to a human?'),
                  React.createElement('input', { className: 'ab-input', type: 'text', placeholder: 'Escalation rule 1', value: formVals.escalation1, onChange: function(e) { handleChange('escalation1', e.target.value); }, style: { marginBottom: 8 } }),
                  React.createElement('input', { className: 'ab-input', type: 'text', placeholder: 'Escalation rule 2', value: formVals.escalation2, onChange: function(e) { handleChange('escalation2', e.target.value); }, style: { marginBottom: 8 } }),
                  React.createElement('input', { className: 'ab-input', type: 'text', placeholder: 'Escalation rule 3', value: formVals.escalation3, onChange: function(e) { handleChange('escalation3', e.target.value); } })
                )
              )
            : React.createElement(React.Fragment, null,
                React.createElement('div', { style: { background: COLORS.faint, border: '1px solid ' + COLORS.deco, borderRadius: 12, padding: '14px 16px', marginBottom: 16 } },
                  React.createElement('p', { style: { margin: 0, fontSize: 13, color: COLORS.foggy, lineHeight: 1.6, fontFamily: FONT } }, 'Prefer to write it out? Describe your agent in your own words. Cover: what it’s for, which sources it can use, what it should never say or do, how it should respond, and when it should hand off to a human. We’ll build your brief from this.')
                ),
                React.createElement('textarea', { className: 'ab-input', rows: 12, placeholder: 'e.g. I want to build an agent that answers onboarding questions for new hires. It should pull from our onboarding wiki and the #new-hires channel...', value: freeText, onChange: function(e) { handleFreeTextChange(e.target.value); } }),
                freeText.trim().length > 0
                  ? React.createElement('p', { style: { margin: '8px 0 0', fontSize: 12, color: freeText.trim().length > 30 ? COLORS.teal : COLORS.foggy, fontFamily: FONT, textAlign: 'right' } }, freeText.trim().length > 30 ? 'Looking good. Continue below or review your preview.' : 'Keep going — a bit more detail and your preview will activate.')
                  : null
              )
        ),
        React.createElement('div', { style: { padding: '16px 24px', background: COLORS.faint, borderTop: '1px solid ' + COLORS.deco, textAlign: 'right' } },
          React.createElement('button', {
            disabled: !isDefined,
            style: { padding: '16px 32px', borderRadius: 12, background: COLORS.rausch, color: COLORS.white, border: 'none', cursor: isDefined ? 'pointer' : 'not-allowed', fontSize: 17, fontWeight: 600, fontFamily: FONT, transition: 'all 0.2s ease', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 10, opacity: isDefined ? 1 : 0.4 }
          }, isDefined ? 'My agent is defined → Continue to testing' : 'Fill in all fields to continue')
        )
      ),

      renderPreview(),

      React.createElement('p', { style: { fontSize: 13, color: COLORS.foggy, textAlign: 'center', fontFamily: FONT } }, 'Continue below to test your agent before deployment.')
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AgentBuilder));
</script>
