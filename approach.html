/* ============================================================
   THE APPROACH — "THE ONE SENTENCE"
   ------------------------------------------------------------
   The approach page: one thought, revised in front of you.
   Five drafts: stance, method, proof, point, door.

   The homepage is a single giant sentence, and scrolling
   rewrites it. Five drafts, each one a section: stance,
   method, proof, point, door. Words roll out and roll in with
   a stagger; the accent phrase inks itself in as you scroll
   through the zone; the last two drafts flood the page lime,
   then deep blue. The whole site is one thought being revised.

   Physics: scroll-velocity spring (the sentence leans and lags
   against your scroll like it has mass), staggered word
   springs, scrubbed color fills tied to scroll position.
   ============================================================ */


:root {
  --lime: #96E650;
  --blue: #03599B;
  --magenta: #EC008C;
  --ink: #282828;
  --mid: #686868;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  transition: background 0.7s var(--ease-out), color 0.7s var(--ease-out);
  -webkit-font-smoothing: antialiased;
}

/* the family hairline: the approach wears magenta */
.approach-edge {
  position: fixed; top: 0; left: 0; right: 0;
  height: 4px; background: var(--magenta);
  z-index: 2000; pointer-events: none;
}

/* when a dark draft floods the page, the chrome flips light */
body.flooded .nav__links a:not(.nav__cta) { color: #fff; }
body.flooded .copyright, body.flooded .hint { color: rgba(255,255,255,0.8); }

/* scroll runway — the page's only job is to be tall */
#track { height: 850vh; }

/* ---------- chrome ------------------------------------------------ */
.brand {
  position: fixed; top: 34px; left: 40px; z-index: 20;
  font-family: 'Bauhaus Bool', 'Futura', 'Century Gothic', sans-serif;
  font-weight: 700; font-size: 1.05rem;
}
.concepts {
  position: fixed; top: 36px; right: 40px; z-index: 20;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.62rem; letter-spacing: 0.08em; opacity: 0.55;
}
.concepts a { color: inherit; text-decoration: none; }
.concepts a:hover, .concepts a.here { opacity: 1; text-decoration: underline; }

/* draft rail, field-journal chrome */
.rail {
  position: fixed; left: 40px; top: 50%; transform: translateY(-50%);
  z-index: 20;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.76rem; letter-spacing: 0.1em;
  display: grid; gap: 14px;
}
.rail div { opacity: 0.35; transition: opacity 0.4s var(--ease-out); display: flex; gap: 10px; align-items: center; }
.rail div::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; opacity: 0.35; transition: all 0.4s var(--ease-out);
}
.rail div.on { opacity: 1; }
.rail div.on::before { background: var(--accent, var(--lime)); opacity: 1; }

.hint {
  position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
  z-index: 20;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.76rem; letter-spacing: 0.12em; opacity: 0.6;
  transition: opacity 0.5s var(--ease-out);
}
.hint.gone { opacity: 0; }

.copyright {
  position: fixed; bottom: 34px; right: 40px; z-index: 20;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.66rem; letter-spacing: 0.08em; opacity: 0.55;
}

/* ---------- the sentence ------------------------------------------- */
.ap-stage {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center;
  padding: 0 clamp(24px, 9vw, 140px) 0 clamp(24px, 12vw, 200px);
  pointer-events: none;
  will-change: transform;
}
.sentence {
  font-family: 'Bauhaus Bool', 'Futura', 'Century Gothic', sans-serif;
  font-weight: 800;
  font-size: clamp(2.4rem, 7.6vw, 7.6rem);
  /* Bool's ink runs past its em box top AND bottom — 1.04 let the
     lines collide; 1.16 gives them air */
  line-height: 1.16;
  letter-spacing: -0.015em;
  max-width: 14em;
}

/* Words are clipped ONLY while rolling between drafts. At rest there
   is no clip at all, so no engine quirk can ever shear a glyph while
   anyone is reading. During the roll the sleeve is a polygon() with
   vertices outside the box — honored cross-browser, unlike negative
   inset(), which Chrome clamps to the border box (the tittle bug). */
.w {
  display: inline-block; vertical-align: bottom;
}
.sentence.rolling .w {
  clip-path: polygon(-10% -60%, 110% -60%, 110% 145%, -10% 145%);
}
.w i {
  display: inline-block; font-style: normal;
  transform: translateY(0);
  transition: transform 0.55s var(--ease-out), opacity 0.55s var(--ease-out);
}
.w.out i  { transform: translateY(-230%); opacity: 0; }
.w.pre i  { transform: translateY(235%);  opacity: 0; transition: none; }

/* reduced motion: words cross-fade in place, the sentence never leans */
@media (prefers-reduced-motion: reduce) {
  .w i { transition: opacity 0.3s ease; }
  .w.out i { transform: none; opacity: 0; }
  .w.pre i { transform: none; opacity: 0; }
  .ap-stage { transform: none !important; }
}

/* accent phrase inks itself in as you scroll the zone — gradient
   fill scrubbed by JS via background-position.
   THE i-DOT BUG LIVED HERE: background-clip:text paints letters
   with their background, and backgrounds stop at the box edge —
   Bool's tittles rise past it, so their tops got no paint. The
   padding (pulled back by margin, no layout shift) extends the
   paint box past the ink. */
.w.acc i {
  padding: 0.2em 0.06em;
  margin: -0.2em -0.06em;
  background: linear-gradient(90deg, var(--acc-color) 50%, currentColor 50%);
  background-size: 220% 100%;
  background-position: 100% 0;   /* all ink until the scroll says otherwise */
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* the door: links that appear with the final draft */
.door {
  position: fixed; z-index: 20;
  left: clamp(24px, 9vw, 140px); bottom: 16vh;
  display: flex; gap: 28px;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.72rem; letter-spacing: 0.1em;
  opacity: 0; transform: translateY(14px);
  transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
  pointer-events: none;
}
.door.on { opacity: 1; transform: none; pointer-events: auto; }
.door a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
.door a:hover { opacity: 0.7; }

@media (max-width: 1000px) {
  .rail { display: none; }
  .ap-stage { padding-left: clamp(24px, 9vw, 140px); }
}
@media (max-width: 720px) {
  .brand { left: 20px; }
  .concepts { right: 20px; }
}

<div id="track"></div>

<script>
/* ============================================================
   THE DRAFTS
   Five rewrites of one thought. `acc` marks the accent phrase
   that inks itself in as the zone scrolls; bg/fg flood the page
   for the last two drafts.
   ============================================================ */
const DRAFTS = [
  {
    label: '01 / STANCE',
    words: [
      { t: 'behavior', acc: true }, { t: 'change', acc: true },
      { t: 'over' }, { t: 'checkbox' }, { t: 'training.' },
    ],
    accColor: '#96E650', bg: '#f2efe8', fg: '#282828',
  },
  {
    label: '02 / METHOD',
    words: [
      { t: 'we' }, { t: 'study' }, { t: 'how' }, { t: 'humans' },
      { t: 'actually', acc: true }, { t: 'change.', acc: true },
    ],
    accColor: '#EC008C', bg: '#f2efe8', fg: '#282828',
  },
  {
    label: '03 / PROOF',
    words: [
      { t: 'asked', acc: true }, { t: 'back', acc: true }, { t: 'by' },
      { t: 'apple,' }, { t: 'airbnb,' }, { t: 'gitlab,' },
      { t: 'intuit,' }, { t: 'j&j,' }, { t: 'and' }, { t: 't-mobile.' },
    ],
    accColor: '#03599B', bg: '#f2efe8', fg: '#282828',
  },
  {
    label: '04 / POINT',
    words: [
      { t: 'the' }, { t: 'thinking', acc: true }, { t: 'is' },
      { t: 'the' }, { t: 'job.' },
    ],
    accColor: '#282828', bg: '#96E650', fg: '#282828',
  },
  {
    label: '05 / DOOR',
    words: [ { t: 'see' }, { t: 'the' }, { t: 'work.', acc: true } ],
    accColor: '#96E650', bg: '#03599B', fg: '#ffffff', dark: true,
  },
];

const sentence = document.getElementById('sentence');
const stage = document.getElementById('stage');
const rail = document.getElementById('rail');
const door = document.getElementById('door');
const hint = document.getElementById('hint');

DRAFTS.forEach((d, i) => {
  const el = document.createElement('div');
  el.textContent = d.label;
  el.dataset.i = i;
  rail.appendChild(el);
});

/* ---------- word swap machine -------------------------------------- */
let current = -1;        // draft on stage
let animating = false;
let queued = null;       // last zone requested while animating

function renderDraft(i) {
  const d = DRAFTS[i];
  sentence.innerHTML = '';
  d.words.forEach((w, wi) => {
    const sleeve = document.createElement('span');
    sleeve.className = 'w pre' + (w.acc ? ' acc' : '');
    if (w.acc) sleeve.style.setProperty('--acc-color', d.accColor);
    const core = document.createElement('i');
    core.textContent = w.t;
    core.style.transitionDelay = (wi * 38) + 'ms';
    sleeve.appendChild(core);
    sentence.appendChild(sleeve);
    sentence.appendChild(document.createTextNode(' '));
  });
  // roll the new words up into place. rAF is the smooth path; the
  // timeout is a fallback for browsers that suspend rAF (releasing
  // twice is harmless)
  const release = () => sentence.querySelectorAll('.w').forEach((s) => s.classList.remove('pre'));
  requestAnimationFrame(() => requestAnimationFrame(release));
  setTimeout(release, 90);

  // when the last incoming word lands, the clip comes off immediately
  // (event-driven; the goTo timers are only the fallback)
  const cores = sentence.querySelectorAll('.w i');
  if (cores.length) {
    cores[cores.length - 1].addEventListener('transitionend', () => {
      if (!animating) sentence.classList.remove('rolling');
    }, { once: true });
  }
}

function goTo(i) {
  if (i === current) return;
  if (animating) { queued = i; return; }
  animating = true;
  sentence.classList.add('rolling');
  const from = current;
  current = i;

  // page flood + rail
  document.body.style.background = DRAFTS[i].bg;
  document.body.style.color = DRAFTS[i].fg;
  document.body.classList.toggle('flooded', !!DRAFTS[i].dark);
  rail.querySelectorAll('div').forEach((el, ri) => {
    el.classList.toggle('on', ri === i);
    el.style.setProperty('--accent', DRAFTS[i].accColor);
  });
  door.classList.toggle('on', i === DRAFTS.length - 1);

  if (from === -1) {
    renderDraft(i);
    animating = false;
    setTimeout(() => { if (!animating) sentence.classList.remove('rolling'); }, 900);
    return;
  }
  // roll old words out, staggered, then bring the new draft in
  const sleeves = sentence.querySelectorAll('.w');
  sleeves.forEach((s, wi) => {
    s.querySelector('i').style.transitionDelay = (wi * 26) + 'ms';
    s.classList.add('out');
  });
  setTimeout(() => {
    renderDraft(i);
    setTimeout(() => {
      animating = false;
      if (queued !== null && queued !== current) { const q = queued; queued = null; goTo(q); }
      else {
        queued = null;
        /* incoming words finish their roll, then the clip comes off */
        setTimeout(() => { if (!animating) sentence.classList.remove('rolling'); }, 750);
      }
    }, 80);
  }, 380 + sleeves.length * 26);
}

/* ---------- scroll physics ------------------------------------------ */
/* zone math: which draft, and how deep into it (0..1) */
function zoneAt(y) {
  const span = (document.getElementById('track').offsetHeight - innerHeight) / DRAFTS.length;
  const i = Math.min(DRAFTS.length - 1, Math.floor(y / span));
  const local = Math.min(1, (y - i * span) / span);
  return { i, local };
}

/* velocity spring: the sentence has mass. It lags and leans against
   the scroll, then settles with the same expo ease as everything else */
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let vel = 0, sprung = 0, lastY = scrollY, lastFrame = 0;

function frame() {
  lastFrame = performance.now();
  const y = scrollY;
  vel = y - lastY;
  lastY = y;
  sprung += (vel - sprung) * 0.085;

  if (!REDUCED_MOTION) {
    const lean = Math.max(-4, Math.min(4, sprung * 0.045));
    const lag = Math.max(-30, Math.min(30, sprung * 0.55));
    stage.style.transform = `translateY(${(-lag).toFixed(2)}px) skewY(${(-lean).toFixed(3)}deg)`;
  }

  const { i, local } = zoneAt(y);
  goTo(i);

  // ink the accent phrase in across the first 60% of the zone
  const fill = Math.min(1, local / 0.6);
  sentence.querySelectorAll('.w.acc i').forEach((core) => {
    core.style.backgroundPosition = `${(100 - fill * 100).toFixed(1)}% 0`;
  });

  if (y > 40) hint.classList.add('gone');
}
function loop() {
  frame();
  requestAnimationFrame(loop);
}

document.fonts.ready.then(() => {
  goTo(0);
  requestAnimationFrame(loop);
  /* watchdog: some embedded browsers suspend rAF; keep the scroll
     machine alive at ~20fps if no frame has landed recently */
  setInterval(() => {
    if (performance.now() - lastFrame > 45) frame();
  }, 50);
});

/* ---------- mobile nav toggle (mirrors script.js's injector) --------- */
(function () {
  const nav = document.querySelector('.nav');
  if (nav && !nav.querySelector('.nav__toggle')) {
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'nav__toggle';
    toggle.setAttribute('aria-label', 'Open menu');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.innerHTML = '<span></span>';
    nav.appendChild(toggle);
    const linksPanel = nav.querySelector('.nav__links');
    if (linksPanel && !linksPanel.id) linksPanel.id = 'nav-links';
    if (linksPanel) toggle.setAttribute('aria-controls', linksPanel.id);
    const closeNav = () => {
      nav.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
    };
    toggle.addEventListener('click', () => {
      nav.classList.contains('is-open') ? closeNav() : (nav.classList.add('is-open'), toggle.setAttribute('aria-expanded', 'true'));
    });
    if (linksPanel) linksPanel.addEventListener('click', (e) => { if (e.target.closest('a')) closeNav(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && nav.classList.contains('is-open')) closeNav(); });
  }
})();
</script>
