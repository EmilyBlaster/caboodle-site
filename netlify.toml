# ============================================================================
# netlify.toml — build + deploy config for caboodle-site
# ============================================================================

[build]
  # Build step is one job: regenerate the OG preview images by
  # screenshotting the live hero of each page. Without this, the
  # social previews on LinkedIn, Slack, iMessage etc. would slowly
  # drift out of sync with whatever the homepage actually says.
  # The script runs in seconds and the output PNGs go to assets/og/.
  command  = "npm install --no-audit --no-fund && npx playwright install chromium && npm run build:og"
  publish  = "."

[build.environment]
  # Skip Playwright's heavy chromium re-download if Netlify's cache
  # already has it from a previous build.
  PLAYWRIGHT_BROWSERS_PATH = "/opt/buildhome/.cache/ms-playwright"
  NODE_VERSION             = "20"

# ─── Files to exclude from deploy ───────────────────────────────────────────
# Belt-and-suspenders alongside .gitignore. If a reference folder ever sneaks
# into a commit, Netlify still won't publish it.

[build.processing]
  skip_processing = false

# ─── Asset processing ───────────────────────────────────────────────────────
# Let Netlify minify + optimize CSS/JS/HTML on deploy. Free perf win.

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# ─── Security + cache headers live in /_headers (better for granular rules)
# Redirects live in /_redirects if you need them later.
