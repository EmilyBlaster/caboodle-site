# ============================================================================
# netlify.toml — build + deploy config for caboodle-site
# ============================================================================

[build]
  # No build step. OG preview images are pre-generated locally by
  # running `node scripts/generate-og.mjs` and committed to the repo
  # as PNG files in assets/og/. Netlify just serves the files as-is.
  # Whenever positioning copy changes, update the assets/og/og-*.html
  # template files, run the script locally, commit the new PNGs, push.
  command  = "echo 'Static site. OG images are pre-generated and committed.'"
  publish  = "."

# ─── Files to exclude from deploy ───────────────────────────────────────────
# Belt-and-suspenders alongside .gitignore. If a reference folder ever sneaks
# into a commit, Netlify still won't publish it.

[build.processing]
  skip_processing = false

# ─── Asset processing ───────────────────────────────────────────────────────
# Let Netlify minify + optimize CSS/JS/HTML on deploy. Free perf win.

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# ─── Security + cache headers live in /_headers (better for granular rules)
# Redirects live in /_redirects if you need them later.
